<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanmay’s Ultimate Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220;
  --text:#e6eef8;
  --accent:#00f0ff;
  --accent2:#ff00ff;
}
body{
  margin:0;
  font-family:'VT323',monospace;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
h1{
  font-family:'Press Start 2P',cursive;
  color:var(--accent);
  text-shadow:0 0 8px var(--accent);
  text-align:center;
  margin:20px;
  font-size:1.2em;
}
button{
  font-family:'Press Start 2P',cursive;
  background:var(--bg);
  border:2px solid var(--accent);
  color:var(--accent2);
  padding:15px 20px;
  margin:10px 0;
  cursor:pointer;
  font-size:0.8em;
}
button:hover{
  box-shadow:0 0 12px var(--accent),0 0 24px var(--accent2);
}
#puzzle-container{
  background:#111;
  padding:20px;
  border:2px solid var(--accent);
  border-radius:8px;
  margin-top:20px;
  width:90%;
  max-width:400px;
  text-align:center;
  transition: transform 0.2s;
}
#secret{
  color:#ffff00;
  margin-top:20px;
  font-family:'Press Start 2P';
  font-size:14px;
  text-align:center;
  min-height:60px;
}
input{
  padding:12px;
  margin-top:10px;
  width:90%;
  border:2px solid var(--accent);
  background:#111;
  color:var(--text);
  font-size:0.8em;
}
</style>
</head>
<body>

<h1>Tanmay’s Secret Challenge</h1>
<div id="puzzle-container">
  <div id="puzzle">Loading question...</div>
  <input type="text" id="answer" placeholder="Enter your answer">
  <button onclick="submitAnswer()">Submit</button>
</div>
<div id="secret">Solve puzzles to reveal Tanmay’s secrets!</div>

<script>
const puzzleContainer = document.getElementById('puzzle-container');
const secretDiv = document.getElementById('secret');

// 30 medium-level questions
const mediumQuestions = [
  {q:"x + 2y = 10 and x - y = 3, find x,y (format: x,y)", a:"4,3"},
  {q:"Next number: 1,1,2,6,24, ?", a:"120"},
  {q:"Solve: 3x - 7 = 5", a:"4"},
  {q:"Tanmay collected 12 stickers, then 8 more, how many total?", a:"20"},
  {q:"If x/2 + 3 = 7, x=?", a:"8"},
  {q:"Next number: 2,4,8,16, ?", a:"32"},
  {q:"Solve: 5x + 3 = 23", a:"4"},
  {q:"Tanmay has 15 apples, gives 7, how many left?", a:"8"},
  {q:"2x + 3y = 12, x - y = 2, find x,y (format: x,y)", a:"4,2"},
  {q:"Next number: 3,6,12,24, ?", a:"48"},
  {q:"Solve: 7x - 14 = 0", a:"2"},
  {q:"Tanmay bought 3 pens at $2 each and 2 notebooks at $3 each, total cost?", a:"12"},
  {q:"If 4x - 5 = 11, x=?", a:"4"},
  {q:"Next number: 5,10,20,40, ?", a:"80"},
  {q:"Solve: 2x + 7 = 15", a:"4"},
  {q:"Tanmay ran 5 km each day for 4 days, total distance?", a:"20"},
  {q:"x + y = 9 and x - y = 1, find x,y (format: x,y)", a:"5,4"},
  {q:"Next number: 0,1,1,2,3, ?", a:"5"},
  {q:"Solve: 6x - 9 = 15", a:"4"},
  {q:"Tanmay has 20 candies, eats 7, how many left?", a:"13"},
  {q:"If x/3 + 4 = 8, x=?", a:"12"},
  {q:"Next number: 2,3,5,8,13, ?", a:"21"},
  {q:"Solve: 8x - 16 = 16", a:"4"},
  {q:"Tanmay picked 7 flowers each day for 3 days, total?", a:"21"},
  {q:"x + 3y = 15 and 2x - y = 4, find x,y (format: x,y)", a:"4,3"},
  {q:"Next number: 1,4,9,16, ?", a:"25"},
  {q:"Solve: 3x + 5 = 17", a:"4"},
  {q:"Tanmay read 6 pages per day for 5 days, total pages?", a:"30"},
  {q:"If 5x - 10 = 10, x=?", a:"4"},
  {q:"Next number: 1,2,4,8, ?", a:"16"}
];

let attempts = 0;
let currentIndex = 0;

function loadPuzzle(){ 
  if(currentIndex >= mediumQuestions.length){
    secretDiv.innerHTML="<h2>🎉 All questions completed!</h2>";
    puzzleContainer.style.display="none";
    return;
  }
  currentPuzzle = mediumQuestions[currentIndex];
  document.getElementById('puzzle').textContent = currentPuzzle.q;
  document.getElementById('answer').value='';
}

function submitAnswer(){
  attempts++;
  currentIndex++;
  if(attempts >= 5){
    secretDiv.innerHTML="<h1 style='color:#ff00ff; font-size:32px;'>Padh le chutiye</h1>";
    puzzleContainer.style.display="none";
    return;
  }
  loadPuzzle();
}

// Start the first puzzle
loadPuzzle();
</script>
</body>
</html>
